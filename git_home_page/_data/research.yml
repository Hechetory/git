introduction: >-
  My current interests center on $p$-adic geometry. I am especially curious about how analysis, algebra, geometry, and number theory
  meet in the $p$-adic setting.

interests:
  - title: $p$-adic geometry
    description: >-
      Rigid spaces, formal schemes, perfectoid spaces and their applications to arithmetic problems.
  - title: formal groups
    description: >-
      The $p$-adic upper half-plane acting as a moduli space parametrizing some special $p$-divisible groups.
